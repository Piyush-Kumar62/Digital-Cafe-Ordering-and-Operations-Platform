name: ci-cd

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository_owner }}/digital-cafe-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository_owner }}/digital-cafe-frontend

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Backend compile
        working-directory: digital-cafe-backend
        run: mvn -B -ntp clean test package

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: digital-cafe-frontend/package-lock.json

      - name: Frontend build
        working-directory: digital-cafe-frontend
        run: |
          npm ci
          npm run build -- --configuration=prod --base-href=/

  build-and-push:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.export.outputs.backend_image }}
      frontend_image: ${{ steps.export.outputs.frontend_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Backend image metadata
        id: backend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=tag

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./digital-cafe-backend
          file: ./infra/docker/backend.Dockerfile
          push: true
          tags: ${{ steps.backend_meta.outputs.tags }}
          labels: ${{ steps.backend_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend image metadata
        id: frontend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=tag

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./digital-cafe-frontend
          file: ./infra/docker/frontend.Dockerfile
          push: true
          build-args: |
            BUILD_CONFIGURATION=prod
            ANGULAR_BASE_HREF=/
          tags: ${{ steps.frontend_meta.outputs.tags }}
          labels: ${{ steps.frontend_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export deployed image tags
        id: export
        run: |
          echo "backend_image=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/digital-cafe

            echo "Logging in to GHCR..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "Preparing deploy env..."
            export BACKEND_IMAGE='${{ needs.build-and-push.outputs.backend_image }}'
            export FRONTEND_IMAGE='${{ needs.build-and-push.outputs.frontend_image }}'
            export GHCR_USERNAME='${{ github.actor }}'
            export GHCR_TOKEN='${{ secrets.GHCR_TOKEN }}'

            if [ -f digital-cafe-backend/env/.env.prod ]; then
              cp digital-cafe-backend/env/.env.prod digital-cafe-backend/env/.env.prod.bak.$(date +%s)
            fi

            if grep -q '^BACKEND_IMAGE=' digital-cafe-backend/env/.env.prod 2>/dev/null; then
              sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=$BACKEND_IMAGE|" digital-cafe-backend/env/.env.prod
            else
              echo "BACKEND_IMAGE=$BACKEND_IMAGE" >> digital-cafe-backend/env/.env.prod
            fi

            if grep -q '^FRONTEND_IMAGE=' digital-cafe-backend/env/.env.prod 2>/dev/null; then
              sed -i "s|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=$FRONTEND_IMAGE|" digital-cafe-backend/env/.env.prod
            else
              echo "FRONTEND_IMAGE=$FRONTEND_IMAGE" >> digital-cafe-backend/env/.env.prod
            fi

            echo "Pulling latest images..."
            docker compose --env-file digital-cafe-backend/env/.env.prod -f infra/compose/docker-compose.prod.yml pull

            echo "Restarting stack..."
            docker compose --env-file digital-cafe-backend/env/.env.prod -f infra/compose/docker-compose.prod.yml up -d --remove-orphans

            echo "Container status:"
            docker compose --env-file digital-cafe-backend/env/.env.prod -f infra/compose/docker-compose.prod.yml ps

            echo "Waiting for API health..."
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1/api/public/health >/dev/null; then
                echo "API healthy"
                exit 0
              fi
              sleep 5
            done

            echo "API health check failed; dumping logs"
            docker compose --env-file digital-cafe-backend/env/.env.prod -f infra/compose/docker-compose.prod.yml logs --tail=200 backend nginx
            exit 1
