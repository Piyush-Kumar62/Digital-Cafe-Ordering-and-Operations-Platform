name: CI-CD

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Backend compile check
        working-directory: digital-cafe-backend
        run: mvn -B -DskipTests compile

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: digital-cafe-frontend/package-lock.json

      - name: Frontend install
        working-directory: digital-cafe-frontend
        run: npm ci

      - name: Verify Cypress binary
        working-directory: digital-cafe-frontend
        run: npx cypress verify

      - name: Frontend build check
        working-directory: digital-cafe-frontend
        run: npm run build -- --configuration development

      - name: Frontend lint (non-blocking)
        working-directory: digital-cafe-frontend
        continue-on-error: true
        run: npm run lint

  backend-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Run backend tests with coverage
        working-directory: digital-cafe-backend
        run: mvn -B verify
        env:
          JWT_SECRET: 0123456789abcdef0123456789abcdef

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: digital-cafe-backend/target/site/jacoco

  frontend-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: digital-cafe-frontend/package-lock.json

      - name: Frontend install
        working-directory: digital-cafe-frontend
        run: npm ci

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run unit tests
        working-directory: digital-cafe-frontend
        run: npm run test:ci
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: digital-cafe-frontend/coverage

  e2e-role-workflows:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: digital-cafe-frontend/package-lock.json

      - name: Set up Chrome
        id: setup-chrome-e2e
        uses: browser-actions/setup-chrome@v1

      - name: Frontend install
        working-directory: digital-cafe-frontend
        run: npm ci

      - name: Start backend (e2e profile)
        run: |
          cd digital-cafe-backend
          mvn -B -DskipTests spring-boot:run -Dspring-boot.run.profiles=e2e -Dspring-boot.run.useTestClasspath=true > ../backend-e2e.log 2>&1 &
          echo $! > ../backend.pid

      - name: Wait for backend
        run: |
          for i in {1..90}; do
            if curl -fsS http://localhost:8080/api/public/health > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start"
          exit 1

      - name: Start frontend
        run: |
          cd digital-cafe-frontend
          npm run start -- --host 0.0.0.0 --port 4200 > ../frontend-e2e.log 2>&1 &
          echo $! > ../frontend.pid

      - name: Wait for frontend
        run: |
          for i in {1..90}; do
            if curl -fsS http://localhost:4200 > /dev/null; then
              echo "Frontend is up"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to start"
          exit 1

      - name: Run Cypress API role workflows
        working-directory: digital-cafe-frontend
        run: xvfb-run -a npm run e2e:api
        env:
          CHROME_BIN: ${{ steps.setup-chrome-e2e.outputs.chrome-path }}
          CYPRESS_apiUrl: http://localhost:8080/api

      - name: Run Cypress UI role workflows
        working-directory: digital-cafe-frontend
        run: xvfb-run -a npm run e2e:ui
        env:
          CHROME_BIN: ${{ steps.setup-chrome-e2e.outputs.chrome-path }}
          CYPRESS_apiUrl: http://localhost:8080/api

      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-runtime-logs
          path: |
            backend-e2e.log
            frontend-e2e.log

      - name: Stop background services
        if: always()
        run: |
          test -f backend.pid && kill $(cat backend.pid) || true
          test -f frontend.pid && kill $(cat frontend.pid) || true

  build-images:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, e2e-role-workflows]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/digital-cafe-backend
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./digital-cafe-backend
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}

      - name: Extract metadata (frontend)
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/digital-cafe-frontend
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./digital-cafe-frontend
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}

  deploy-ec2:
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/digital-cafe
            chmod +x scripts/deploy.sh scripts/render-env-from-ssm.sh || true
            export SSM_PREFIX=${{ secrets.SSM_PARAMETER_PREFIX }}
            if [ -n "${{ secrets.SSM_PARAMETER_PREFIX }}" ]; then
              export RENDER_ENV_FROM_SSM=true
            else
              export RENDER_ENV_FROM_SSM=false
            fi
            export BACKEND_HEALTH_URL=${{ secrets.DEPLOY_BACKEND_HEALTH_URL }}
            export FRONTEND_HEALTH_URL=${{ secrets.DEPLOY_FRONTEND_HEALTH_URL }}
            export GHCR_USERNAME=${{ secrets.GHCR_USERNAME }}
            export GHCR_TOKEN=${{ secrets.GHCR_TOKEN }}
            ./scripts/deploy.sh
            docker image prune -f

      - name: Post-deploy API health check
        env:
          DEPLOY_PUBLIC_HEALTHCHECK_URL: ${{ secrets.DEPLOY_PUBLIC_HEALTHCHECK_URL }}
        run: |
          HEALTH_URL="${DEPLOY_PUBLIC_HEALTHCHECK_URL:-https://api.cafehub.tech/api/public/health}"
          for i in {1..30}; do
            if curl -fsS "$HEALTH_URL" > /dev/null; then
              echo "Deployment health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Deployment health check failed"
          exit 1
