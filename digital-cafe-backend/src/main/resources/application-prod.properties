# Production safety defaults (no demo seeding in prod)
app.dev.seed.enabled=false
app.dev.seed.log-credentials=false
app.dev.seed.verbose=false
app.startup.diagnostics.enabled=false

spring.jpa.properties.hibernate.format_sql=false
# ==============================
# Import .env (supports running from repo root or backend module)
# ==============================
spring.config.import=optional:file:./env/.env.local,optional:file:./env/.env.${spring.profiles.active},optional:file:./digital-cafe-backend/env/.env.local,optional:file:./digital-cafe-backend/env/.env.${spring.profiles.active}
spring.application.name=digital-cafe-backend

# ==============================
# App Configuration
# ==============================
app.name=${APP_NAME:Digital Cafe Platform}
app.frontend.url=${FRONTEND_URL:http://localhost:4200}
app.data.init.enabled=${APP_DATA_INIT_ENABLED:false}
app.education.import.sync=${APP_EDUCATION_IMPORT_SYNC:false}
app.education.auto-import.enabled=false
app.education.auto-import.filename=list_all_colleges_2011_2012.csv
app.education.auto-import.min-count=100

# ==============================
# Server
# ==============================
server.port=${SERVER_PORT:8080}

# ==============================
# Rate Limiting
# ==============================
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.capacity=${RATE_LIMIT_CAPACITY:240}
app.rate-limit.refill-per-minute=${RATE_LIMIT_REFILL_PER_MINUTE:240}

# ==============================
# Uploads
# ==============================
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:20MB}

# ==============================
# Database
# ==============================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:digital_cafe_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.connection.driver_class=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.main.banner-mode=console

# ==============================
# JWT
# ==============================
jwt.secret=${JWT_SECRET:replace-with-prod-jwt-secret-32-bytes-minimum}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ==============================
# Email
# ==============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}

# ==============================
# Email Branding
# ==============================
app.email.enabled=${MAIL_ENABLED:true}
app.email.from-name=${EMAIL_FROM_NAME:Digital Cafe Team}
app.email.from-email=${MAIL_FROM_EMAIL:${MAIL_USERNAME:}}

# ==============================
# Payment
# ==============================
payment.gateway=${PAYMENT_GATEWAY:RAZORPAY}
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
app.webhook.async.enabled=${WEBHOOK_ASYNC_ENABLED:true}

# ==============================
# AWS
# ==============================
aws.s3.bucket=${S3_BUCKET:}
aws.s3.region=${AWS_REGION:ap-south-1}
aws.credentials.access-key=${AWS_ACCESS_KEY_ID:}
aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:}

# ==============================
# Logging
# ==============================
logging.level.root=INFO
logging.level.com.digitalcafe=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.tool.schema=ERROR
logging.level.org.hibernate.validator.internal.util.Version=OFF
logging.level.org.hibernate.orm.connections.pooling=ERROR
logging.level.org.hibernate.SQL_SLOW=WARN

# Keep startup info concise in production
spring.main.log-startup-info=false

# ==============================
# Swagger
# ==============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=${SLOW_QUERY_MS:800}
app.logging.service.enabled=${SERVICE_LOGGING_ENABLED:true}
app.logging.slow-service-ms=${SERVICE_LOGGING_SLOW_MS:500}
