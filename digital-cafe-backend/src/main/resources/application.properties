# ==============================
# Import .env (works from repo root or backend module)
# ==============================
spring.config.import=optional:file:./env/.env.${spring.profiles.active}[.properties],optional:file:./env/.env.local[.properties],optional:file:./digital-cafe-backend/env/.env.${spring.profiles.active}[.properties],optional:file:./digital-cafe-backend/env/.env.local[.properties]

# Default local profile for IDE runs (override with SPRING_PROFILES_ACTIVE=prod in production)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.application.name=digital-cafe-backend
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ==============================
# App Configuration
# ==============================
app.name=${APP_NAME:Digital Cafe Platform}
admin.email=${ADMIN_EMAIL:cafehub.admin@gmail.com}
app.admin.bootstrap.enabled=${APP_ADMIN_BOOTSTRAP_ENABLED:true}
app.frontend.url=${FRONTEND_URL:http://localhost:4200}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:4200},http://localhost:3000}}
app.data.init.enabled=${APP_DATA_INIT_ENABLED:false}
app.education.seed.enabled=${APP_EDUCATION_SEED_ENABLED:true}
app.education.import.degrees.enabled=${APP_EDUCATION_IMPORT_DEGREES_ENABLED:false}
app.education.import.branches.enabled=${APP_EDUCATION_IMPORT_BRANCHES_ENABLED:false}
app.education.import.sync=${APP_EDUCATION_IMPORT_SYNC:false}
app.education.auto-import.enabled=${APP_EDUCATION_AUTO_IMPORT_ENABLED:false}
app.education.auto-import.filename=${APP_EDUCATION_AUTO_IMPORT_FILENAME:list_all_colleges_2011_2012.csv}
app.education.auto-import.min-count=${APP_EDUCATION_AUTO_IMPORT_MIN_COUNT:100}

# ==============================
# Server
# ==============================
server.port=${SERVER_PORT:8080}

# ==============================
# Rate Limiting
# ==============================
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.capacity=${RATE_LIMIT_CAPACITY:120}
app.rate-limit.refill-per-minute=${RATE_LIMIT_REFILL_PER_MINUTE:120}
app.rate-limit.auth.enabled=${RATE_LIMIT_AUTH_ENABLED:true}
app.rate-limit.auth.capacity=${RATE_LIMIT_AUTH_CAPACITY:20}
app.rate-limit.auth.refill-per-minute=${RATE_LIMIT_AUTH_REFILL_PER_MINUTE:20}
app.auth.lockout.enabled=${AUTH_LOCKOUT_ENABLED:true}
app.auth.lockout.max-failed-attempts=${AUTH_LOCKOUT_MAX_FAILED_ATTEMPTS:5}
app.auth.lockout.duration-minutes=${AUTH_LOCKOUT_DURATION_MINUTES:15}
app.csrf.enabled=${APP_CSRF_ENABLED:true}
app.csrf.header-name=${APP_CSRF_HEADER_NAME:X-XSRF-TOKEN}
app.security.headers.enabled=${APP_SECURITY_HEADERS_ENABLED:true}
app.security.headers.content-security-policy=${APP_SECURITY_HEADERS_CSP:default-src 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'}
app.security.headers.referrer-policy=${APP_SECURITY_HEADERS_REFERRER_POLICY:strict-origin-when-cross-origin}
app.security.headers.permissions-policy=${APP_SECURITY_HEADERS_PERMISSIONS_POLICY:geolocation=(), camera=(), microphone=()}
app.security.headers.hsts-max-age=${APP_SECURITY_HEADERS_HSTS_MAX_AGE:31536000}
app.security.headers.hsts-include-subdomains=${APP_SECURITY_HEADERS_HSTS_INCLUDE_SUBDOMAINS:true}

# ==============================
# Uploads
# ==============================
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:20MB}
app.upload.dir=${APP_UPLOAD_DIR:uploads}
app.storage.provider=${APP_STORAGE_PROVIDER:local}

# ==============================
# Database
# ==============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:digital_cafe_dev_db}?sslmode=${DB_SSL_MODE:prefer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
app.database.enforce-postgres-only=${APP_DATABASE_ENFORCE_POSTGRES_ONLY:true}
spring.flyway.enabled=false
spring.liquibase.enabled=false

# ==============================
# JPA
# ==============================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.connection.driver_class=org.postgresql.Driver
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.main.banner-mode=console

# ==============================
# JWT
# ==============================
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ==============================
# Email
# ==============================
spring.mail.host=${BREVO_SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${BREVO_SMTP_USER:}
spring.mail.password=${BREVO_SMTP_PASS:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SMTP_SSL_TRUST:${BREVO_SMTP_HOST:smtp-relay.brevo.com}}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT_MS:8000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT_MS:8000}

# ==============================
# Email Branding
# ==============================
app.email.enabled=${MAIL_ENABLED:true}
app.email.from-name=${EMAIL_FROM_NAME:CafeHub}
app.email.from-email=${MAIL_FROM_EMAIL:no-reply@cafehub.tech}
app.email.retry.max-attempts=${EMAIL_RETRY_MAX_ATTEMPTS:3}
app.email.retry.initial-delay-ms=${EMAIL_RETRY_INITIAL_DELAY_MS:1000}
app.email.retry.max-delay-ms=${EMAIL_RETRY_MAX_DELAY_MS:10000}
app.email.retry.multiplier=${EMAIL_RETRY_MULTIPLIER:2.0}
app.email.test-endpoint.enabled=${APP_EMAIL_TEST_ENDPOINT_ENABLED:false}
app.email.async.core-pool-size=${EMAIL_ASYNC_CORE_POOL_SIZE:4}
app.email.async.max-pool-size=${EMAIL_ASYNC_MAX_POOL_SIZE:12}
app.email.async.queue-capacity=${EMAIL_ASYNC_QUEUE_CAPACITY:500}
app.email.async.await-termination-seconds=${EMAIL_ASYNC_AWAIT_TERMINATION_SECONDS:45}

# ==============================
# Payment
# ==============================
payment.gateway=${PAYMENT_GATEWAY:TEST}
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
app.webhook.async.enabled=${WEBHOOK_ASYNC_ENABLED:true}

# ==============================
# AWS
# ==============================
aws.s3.bucket=${S3_BUCKET}
aws.s3.region=${AWS_REGION}
aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}

# ==============================
# Logging
# ==============================
logging.level.root=INFO
logging.level.com.digitalcafe=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.tool.schema=ERROR
logging.level.org.hibernate.validator.internal.util.Version=OFF
logging.level.org.hibernate.orm.connections.pooling=ERROR
logging.level.org.hibernate.SQL_SLOW=WARN
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
logging.level.org.hibernate.orm.deprecation=ERROR
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=${SLOW_QUERY_MS:800}
app.logging.service.enabled=${SERVICE_LOGGING_ENABLED:true}
app.logging.slow-service-ms=${SERVICE_LOGGING_SLOW_MS:500}
app.logging.sensitive.enabled=${SENSITIVE_LOGGING_ENABLED:false}

# ==============================
# Swagger
# ==============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
