<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Account Activated — Digital Cafe</title>
    <style>
      @media (prefers-color-scheme: dark) {
        .email-card {
          background-color: #111827 !important;
        }
      }
      @media only screen and (max-width: 600px) {
        .body-content {
          padding: 28px 20px !important;
        }
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f3f4f6;
      background-image: radial-gradient(
        ellipse at top,
        #ede9fe 0%,
        #f3f4f6 60%
      );
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f3f4f6; padding: 40px 16px"
    >
      <tr>
        <td align="center">
          <table role="presentation" width="100%" style="max-width: 600px">
            <tr>
              <td><div th:replace="~{fragments/header :: header}"></div></td>
            </tr>

            <tr>
              <td style="background: #ffffff; padding: 40px; border-radius: 0">
                <h2
                  style="
                    margin: 0 0 8px;
                    font-family:
                      -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                      Roboto, Arial, sans-serif;
                    font-size: 22px;
                    font-weight: 700;
                    color: #111827;
                  "
                >
                  Account Activated, <span th:text="${username}">there</span>!
                  🚀
                </h2>

                <!-- Role badge -->
                <div
                  style="
                    display: inline-block;
                    background: #ede9fe;
                    border-radius: 20px;
                    padding: 6px 16px;
                    margin-bottom: 20px;
                  "
                >
                  <span
                    style="
                      font-family:
                        -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                        Roboto, Arial, sans-serif;
                      font-size: 13px;
                      font-weight: 600;
                      color: #6c4ab6;
                    "
                    th:text="${role}"
                    >Role</span
                  >
                </div>

                <p
                  style="
                    margin: 0 0 24px;
                    font-family:
                      -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                      Roboto, Arial, sans-serif;
                    font-size: 15px;
                    line-height: 1.6;
                    color: #4b5563;
                  "
                >
                  Your email address is verified and your account is now fully
                  active. Log in to access the Digital Cafe platform and get
                  started.
                </p>

                <div
                  th:replace="~{fragments/button :: ctaButton(label='Go to Dashboard', url=${loginUrl})}"
                ></div>
              </td>
            </tr>

            <tr>
              <td><div th:replace="~{fragments/footer :: footer}"></div></td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
