<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CafeHub Admin Notification</title>
</head>
<body style="margin:0;padding:0;background-color:#eef2ff;font-family:'Segoe UI',Arial,sans-serif;color:#111827;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:28px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="620" cellspacing="0" cellpadding="0" style="max-width:620px;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #dbe4ff;box-shadow:0 10px 24px rgba(37,99,235,0.08);">
                <tr>
                    <td style="padding:0;">
                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:linear-gradient(130deg,#1d4ed8,#7c3aed);">
                            <tr>
                                <td style="padding:22px 26px 8px 26px;">
                                    <span style="display:inline-block;background:rgba(255,255,255,0.2);color:#ffffff;font-size:12px;font-weight:700;letter-spacing:0.4px;padding:6px 10px;border-radius:999px;">
                                        ADMIN EVENT
                                    </span>
                                </td>
                            </tr>
                            <tr>
                                <td style="padding:6px 26px 24px 26px;color:#ffffff;">
                                    <div style="font-size:24px;font-weight:700;line-height:1.25;">CafeHub Admin Alert</div>
                                    <div style="margin-top:8px;font-size:14px;opacity:0.92;">Real-time platform event notification</div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td style="padding:26px;">
                        <h2 style="margin:0 0 10px 0;font-size:22px;line-height:1.3;color:#0f172a;" th:text="${title}">System Alert</h2>
                        <div style="margin:0 0 18px 0;padding:14px 16px;background:#f8faff;border:1px solid #dbeafe;border-radius:12px;color:#1f2937;line-height:1.6;" th:text="${eventMessage}">
                            A new system event was raised.
                        </div>
                        <p style="margin:0 0 22px 0;color:#475569;line-height:1.6;">
                            Review this event in the admin dashboard to take action quickly.
                        </p>

                        <table role="presentation" cellspacing="0" cellpadding="0">
                            <tr>
                                <td>
                                    <a th:href="${dashboardUrl}"
                                       style="display:inline-block;background:#2563eb;color:#ffffff;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:10px;">
                                        Open Admin Dashboard
                                    </a>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td style="padding:16px 26px;background:#f8fafc;border-top:1px solid #e2e8f0;font-size:12px;color:#64748b;">
                        This is an automated CafeHub email from <strong>no-reply@cafehub.tech</strong>.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
