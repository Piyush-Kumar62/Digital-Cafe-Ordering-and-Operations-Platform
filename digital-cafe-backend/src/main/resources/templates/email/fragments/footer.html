<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* ─── Reusable Email Footer Fragment ─────────────────────────────────── */-->
<div th:fragment="footer"
     style="background:#f9fafb;
            border-top:1px solid #e5e7eb;
            border-radius:0 0 20px 20px;
            padding:28px 40px;
            text-align:center;">
  <!-- Navigation links -->
  <p style="margin:0 0 12px;
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
            font-size:12px;
            color:#6b7280;">
    <a th:href="${frontendUrl}" href="#"
       style="color:#6C4AB6;text-decoration:none;font-weight:500;">Home</a>
    &nbsp;&nbsp;·&nbsp;&nbsp;
    <a th:href="${supportUrl}" href="#"
       style="color:#6C4AB6;text-decoration:none;font-weight:500;">Support</a>
    &nbsp;&nbsp;·&nbsp;&nbsp;
    <a th:href="|${frontendUrl}/legal/privacy|" href="#"
       style="color:#6C4AB6;text-decoration:none;font-weight:500;">Privacy Policy</a>
  </p>

  <!-- Copyright -->
  <p style="margin:0 0 10px;
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
            font-size:11px;
            color:#9ca3af;">
    &copy; <span th:text="${currentYear}">2025</span> Digital Cafe. All rights reserved.
  </p>

  <!-- Security note -->
  <p style="margin:0;
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
            font-size:11px;
            color:#d1d5db;
            font-style:italic;">
    This email was sent by Digital Cafe. If you did not expect it, please
    <a th:href="${supportUrl}" href="#"
       style="color:#9ca3af;text-decoration:underline;">contact support</a>.
  </p>
</div>
</body>
</html>
