<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <!-- Reusable Email Header Fragment -->
    <div
      th:fragment="header"
      style="
        background: linear-gradient(135deg, #6c4ab6 0%, #4f46e5 100%);
        border-radius: 20px 20px 0 0;
        padding: 26px 30px 22px;
        text-align: center;
      "
    >
      <!-- Logo icon -->
      <div
        style="
          display: inline-block;
          background: rgba(255, 255, 255, 0.15);
          border-radius: 14px;
          width: 54px;
          height: 54px;
          line-height: 54px;
          font-size: 28px;
          margin-bottom: 12px;
        "
      >
        ☕
      </div>
      <!-- Brand name -->
      <h1
        style="
          margin: 0;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto,
            Arial, sans-serif;
          font-size: 22px;
          font-weight: 700;
          color: #ffffff;
          letter-spacing: -0.5px;
        "
      >
        Digital Cafe
      </h1>
      <p
        style="
          margin: 4px 0 0;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto,
            Arial, sans-serif;
          font-size: 12px;
          color: rgba(255, 255, 255, 0.75);
          letter-spacing: 0.8px;
          text-transform: uppercase;
        "
      >
        Ordering &amp; Operations Platform
      </p>
    </div>
  </body>
</html>
