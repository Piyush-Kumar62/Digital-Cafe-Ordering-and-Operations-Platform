<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Order Confirmed — Digital Cafe</title>
    <style>
      @media (prefers-color-scheme: dark) {
        .email-card {
          background-color: #111827 !important;
        }
      }
      @media only screen and (max-width: 600px) {
        .body-content {
          padding: 28px 20px !important;
        }
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f3f4f6;
      background-image: radial-gradient(
        ellipse at top,
        #fef3c7 0%,
        #f3f4f6 60%
      );
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f3f4f6; padding: 40px 16px"
    >
      <tr>
        <td align="center">
          <table role="presentation" width="100%" style="max-width: 600px">
            <tr>
              <td><div th:replace="~{fragments/header :: header}"></div></td>
            </tr>

            <tr>
              <td style="background: #ffffff; padding: 40px; border-radius: 0">
                <div style="font-size: 40px; margin-bottom: 16px">🛒</div>
                <h2
                  style="
                    margin: 0 0 8px;
                    font-family:
                      -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                      Roboto, Arial, sans-serif;
                    font-size: 22px;
                    font-weight: 700;
                    color: #111827;
                  "
                >
                  Order Confirmed!
                </h2>
                <p
                  style="
                    margin: 0 0 24px;
                    font-family:
                      -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                      Roboto, Arial, sans-serif;
                    font-size: 15px;
                    line-height: 1.6;
                    color: #4b5563;
                  "
                >
                  Your order has been received and is being prepared. We'll
                  notify you when it's ready!
                </p>

                <!-- Order details block -->
                <div
                  style="
                    background: #f9fafb;
                    border-radius: 12px;
                    padding: 20px 24px;
                    margin-bottom: 24px;
                    border: 1px solid #e5e7eb;
                  "
                >
                  <p
                    style="
                      margin: 0 0 8px;
                      font-family:
                        -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                        Roboto, Arial, sans-serif;
                      font-size: 12px;
                      font-weight: 600;
                      color: #6b7280;
                      text-transform: uppercase;
                      letter-spacing: 0.5px;
                    "
                  >
                    Order Summary
                  </p>
                  <p
                    style="
                      margin: 0;
                      font-family:
                        -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                        Roboto, Arial, sans-serif;
                      font-size: 14px;
                      color: #374151;
                      white-space: pre-line;
                    "
                    th:text="${orderDetails}"
                  >
                    Order details here
                  </p>
                </div>

                <div
                  th:replace="~{fragments/button :: ctaButton(label='Track My Order', url=${ordersUrl})}"
                ></div>
              </td>
            </tr>

            <tr>
              <td><div th:replace="~{fragments/footer :: footer}"></div></td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
