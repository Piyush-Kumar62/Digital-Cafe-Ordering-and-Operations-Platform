<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Thank You — Digital Cafe</title>
    <style>
      @media (prefers-color-scheme: dark) {
        .email-card {
          background-color: #111827 !important;
        }
      }
      @media only screen and (max-width: 600px) {
        .body-content {
          padding: 28px 20px !important;
        }
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f3f4f6;
      background-image: radial-gradient(
        ellipse at top,
        #fdf4ff 0%,
        #f3f4f6 60%
      );
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f3f4f6; padding: 40px 16px"
    >
      <tr>
        <td align="center">
          <table role="presentation" width="100%" style="max-width: 600px">
            <tr>
              <td><div th:replace="~{fragments/header :: header}"></div></td>
            </tr>

            <tr>
              <td
                style="
                  background: #ffffff;
                  padding: 40px;
                  border-radius: 0;
                  text-align: center;
                "
              >
                <div style="font-size: 56px; margin-bottom: 16px">⭐</div>
                <h2
                  style="
                    margin: 0 0 8px;
                    font-family:
                      -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                      Roboto, Arial, sans-serif;
                    font-size: 24px;
                    font-weight: 700;
                    color: #111827;
                  "
                >
                  Thank You for Dining with Us!
                </h2>
                <p
                  th:if="${orderNumber}"
                  style="
                    display: inline-block;
                    margin: 0 0 16px;
                    padding: 6px 14px;
                    background: #ede9fe;
                    border-radius: 999px;
                    font-family:
                      -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                      Roboto, Arial, sans-serif;
                    font-size: 13px;
                    font-weight: 600;
                    color: #5b21b6;
                    letter-spacing: 0.3px;
                  "
                  th:text="'Order #' + ${orderNumber}"
                ></p>
                <p
                  style="
                    margin: 0 0 28px;
                    font-family:
                      -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                      Roboto, Arial, sans-serif;
                    font-size: 15px;
                    line-height: 1.6;
                    color: #4b5563;
                    text-align: center;
                  "
                >
                  We hope you enjoyed your meal. Your order has been served —
                  come back soon! 🙏
                </p>
                <div
                  th:replace="~{fragments/button :: ctaButton(label='View My Orders', url=${ordersUrl})}"
                ></div>
              </td>
            </tr>

            <tr>
              <td><div th:replace="~{fragments/footer :: footer}"></div></td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
