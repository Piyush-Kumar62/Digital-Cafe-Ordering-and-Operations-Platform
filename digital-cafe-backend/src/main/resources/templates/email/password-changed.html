<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Password Changed — Digital Cafe</title>
    <style>
      @media (prefers-color-scheme: dark) {
        .email-card {
          background-color: #111827 !important;
        }
        .body-text {
          color: #d1d5db !important;
        }
      }
      @media only screen and (max-width: 600px) {
        .body-content {
          padding: 28px 20px !important;
        }
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f3f4f6;
      background-image: radial-gradient(
        ellipse at top,
        #ede9fe 0%,
        #f3f4f6 60%
      );
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f3f4f6; padding: 40px 16px"
    >
      <tr>
        <td align="center">
          <table role="presentation" width="100%" style="max-width: 600px">
            <tr>
              <td><div th:replace="~{fragments/header :: header}"></div></td>
            </tr>

            <tr>
              <td style="background: #ffffff; padding: 40px; border-radius: 0">
                <div
                  style="
                    background: #d1fae5;
                    border-radius: 50%;
                    width: 56px;
                    height: 56px;
                    line-height: 56px;
                    text-align: center;
                    font-size: 28px;
                    margin: 0 0 20px;
                  "
                >
                  🔒
                </div>
                <h2
                  style="
                    margin: 0 0 8px;
                    font-family:
                      -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                      Roboto, Arial, sans-serif;
                    font-size: 22px;
                    font-weight: 700;
                    color: #111827;
                  "
                >
                  Password Changed Successfully
                </h2>
                <p
                  style="
                    margin: 0 0 20px;
                    font-family:
                      -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                      Roboto, Arial, sans-serif;
                    font-size: 15px;
                    line-height: 1.6;
                    color: #4b5563;
                  "
                >
                  Your Digital Cafe account password has been updated
                  successfully. You can now log in with your new credentials.
                </p>

                <div
                  th:replace="~{fragments/button :: ctaButton(label='Go to Login', url=${loginUrl})}"
                ></div>

                <!-- Security alert block -->
                <div
                  style="
                    margin-top: 24px;
                    background: #fef2f2;
                    border-left: 4px solid #ef4444;
                    border-radius: 0 8px 8px 0;
                    padding: 16px 20px;
                  "
                >
                  <p
                    style="
                      margin: 0;
                      font-family:
                        -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                        Roboto, Arial, sans-serif;
                      font-size: 13px;
                      color: #7f1d1d;
                      line-height: 1.5;
                    "
                  >
                    <strong>Didn't make this change?</strong><br />
                    If you did not change your password, your account may be
                    compromised. Please
                    <a
                      th:href="${supportUrl}"
                      href="#"
                      style="color: #dc2626; font-weight: 600"
                      >contact support</a
                    >
                    immediately.
                  </p>
                </div>
              </td>
            </tr>

            <tr>
              <td><div th:replace="~{fragments/footer :: footer}"></div></td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
