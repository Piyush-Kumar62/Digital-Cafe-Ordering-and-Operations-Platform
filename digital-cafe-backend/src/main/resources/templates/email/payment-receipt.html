<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Payment Receipt — Digital Cafe</title>
    <style>
      @media only screen and (max-width: 600px) {
        .body-content {
          padding: 28px 20px !important;
        }
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f3f4f6;
      background-image: radial-gradient(
        ellipse at top,
        #dcfce7 0%,
        #f3f4f6 65%
      );
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f3f4f6; padding: 40px 16px"
    >
      <tr>
        <td align="center">
          <table role="presentation" width="100%" style="max-width: 600px">
            <tr>
              <td><div th:replace="~{fragments/header :: header}"></div></td>
            </tr>

            <tr>
              <td style="background: #ffffff; padding: 40px; border-radius: 0">
                <div style="font-size: 40px; margin-bottom: 16px">✅</div>
                <h2
                  style="
                    margin: 0 0 8px;
                    font-family:
                      -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                      Roboto, Arial, sans-serif;
                    font-size: 22px;
                    font-weight: 700;
                    color: #111827;
                  "
                >
                  Payment Successful
                </h2>
                <p
                  style="
                    margin: 0 0 16px;
                    font-family:
                      -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                      Roboto, Arial, sans-serif;
                    font-size: 15px;
                    line-height: 1.6;
                    color: #4b5563;
                  "
                >
                  Hi <span th:text="${username}">Customer</span>, your payment has
                  been received. Keep this receipt for your records.
                </p>
                <p
                  style="
                    margin: 0 0 20px;
                    font-family:
                      -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                      Roboto, Arial, sans-serif;
                    font-size: 13px;
                    line-height: 1.6;
                    color: #065f46;
                  "
                >
                  A PDF receipt is attached to this email.
                </p>

                <p
                  style="
                    margin: 0 0 20px;
                    font-family:
                      -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                      Roboto, Arial, sans-serif;
                    font-size: 13px;
                    font-weight: 600;
                    color: #065f46;
                    background: #ecfdf5;
                    border: 1px solid #a7f3d0;
                    border-radius: 10px;
                    padding: 10px 12px;
                    display: inline-block;
                  "
                >
                  Receipt No: <span th:text="${receiptNumber}">RCPT-0001</span>
                </p>

                <div
                  style="
                    background: #f9fafb;
                    border-radius: 12px;
                    padding: 20px 24px;
                    margin-bottom: 24px;
                    border: 1px solid #e5e7eb;
                  "
                >
                  <p
                    style="
                      margin: 0 0 8px;
                      font-family:
                        -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                        Roboto, Arial, sans-serif;
                      font-size: 12px;
                      font-weight: 600;
                      color: #6b7280;
                      text-transform: uppercase;
                      letter-spacing: 0.5px;
                    "
                  >
                    Payment Slip
                  </p>
                  <p
                    style="
                      margin: 0;
                      font-family:
                        -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                        Roboto, Arial, sans-serif;
                      font-size: 14px;
                      color: #374151;
                      white-space: pre-line;
                      line-height: 1.6;
                    "
                    th:text="${paymentDetails}"
                  >
                    Payment details here
                  </p>
                </div>

                <div
                  th:replace="~{fragments/button :: ctaButton(label='View Payments', url=${paymentsUrl})}"
                ></div>

                <div style="height: 12px"></div>

                <div
                  th:replace="~{fragments/button :: ctaButton(label='Track Orders', url=${ordersUrl})}"
                ></div>
              </td>
            </tr>

            <tr>
              <td><div th:replace="~{fragments/footer :: footer}"></div></td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
