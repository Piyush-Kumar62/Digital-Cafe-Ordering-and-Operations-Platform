<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Reset Password — Digital Cafe</title>
    <style>
      @media (prefers-color-scheme: dark) {
        .email-card {
          background-color: #111827 !important;
        }
        .body-text {
          color: #d1d5db !important;
        }
      }
      @media only screen and (max-width: 600px) {
        .body-content {
          padding: 28px 20px !important;
        }
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f3f4f6;
      background-image: radial-gradient(
        ellipse at top,
        #ede9fe 0%,
        #f3f4f6 60%
      );
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f3f4f6; padding: 40px 16px"
    >
      <tr>
        <td align="center">
          <table role="presentation" width="100%" style="max-width: 600px">
            <tr>
              <td><div th:replace="~{fragments/header :: header}"></div></td>
            </tr>

            <tr>
              <td
                class="email-card body-content"
                style="background: #ffffff; padding: 40px; border-radius: 0"
              >
                <!-- Warning icon -->
                <div
                  style="
                    background: #fef3c7;
                    border-radius: 50%;
                    width: 56px;
                    height: 56px;
                    line-height: 56px;
                    text-align: center;
                    font-size: 28px;
                    margin: 0 0 20px;
                  "
                >
                  🔑
                </div>

                <h2
                  style="
                    margin: 0 0 8px;
                    font-family:
                      -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                      Roboto, Arial, sans-serif;
                    font-size: 22px;
                    font-weight: 700;
                    color: #111827;
                  "
                >
                  Password Reset Request
                </h2>
                <p
                  class="body-text"
                  style="
                    margin: 0 0 24px;
                    font-family:
                      -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                      Roboto, Arial, sans-serif;
                    font-size: 15px;
                    line-height: 1.6;
                    color: #4b5563;
                  "
                >
                  We received a request to reset your Digital Cafe password.
                  Click the button below to choose a new password. This link is
                  valid for <strong>1 hour</strong>.
                </p>

                <div
                  th:replace="~{fragments/button :: ctaButton(label='Reset My Password', url=${resetUrl})}"
                ></div>

                <p
                  class="body-text"
                  style="
                    margin: 20px 0 0;
                    font-family:
                      -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                      Roboto, Arial, sans-serif;
                    font-size: 12px;
                    color: #9ca3af;
                    word-break: break-all;
                  "
                >
                  Or copy:
                  <a
                    th:href="${resetUrl}"
                    th:text="${resetUrl}"
                    style="color: #6c4ab6"
                    >reset link</a
                  >
                </p>

                <hr
                  style="
                    border: none;
                    border-top: 1px solid #f3f4f6;
                    margin: 32px 0 20px;
                  "
                />
                <p
                  style="
                    margin: 0;
                    font-family:
                      -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;,
                      Roboto, Arial, sans-serif;
                    font-size: 12px;
                    color: #9ca3af;
                  "
                >
                  If you did not request a password reset, you can safely ignore
                  this email. Your password will remain unchanged.
                </p>
              </td>
            </tr>

            <tr>
              <td><div th:replace="~{fragments/footer :: footer}"></div></td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
