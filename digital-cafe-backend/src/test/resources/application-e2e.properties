spring.datasource.url=jdbc:h2:mem:digitalcafe-e2e;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=never

jwt.secret=test-secret-key-test-secret-key-test-secret-key-123456
jwt.expiration=86400000
jwt.refresh-expiration=604800000

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@example.com
spring.mail.password=test

payment.gateway=TEST
razorpay.key.id=test
razorpay.key.secret=test

app.frontend.url=http://localhost:4200
app.data.init.enabled=false
