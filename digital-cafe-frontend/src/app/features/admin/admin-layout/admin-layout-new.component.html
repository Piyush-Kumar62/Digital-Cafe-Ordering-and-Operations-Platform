<!-- Modern Admin Layout -->
<div class="flex h-screen overflow-hidden bg-gray-100">
  <!-- Sidebar -->
  <aside
    class="fixed inset-y-0 left-0 z-50 flex flex-col bg-white border-r border-gray-200 transition-all duration-300"
    [class.w-64]="!isSidebarCollapsed"
    [class.w-20]="isSidebarCollapsed"
  >
    <!-- Sidebar Header with Logo -->
    <div
      class="flex items-center justify-between h-16 px-4 border-b border-gray-200"
    >
      <div *ngIf="!isSidebarCollapsed" class="flex items-center">
        <div
          class="flex items-center justify-center h-10 w-10 bg-indigo-600 rounded-lg"
        >
          <svg
            class="w-6 h-6 text-white"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"
            />
          </svg>
        </div>
        <span class="ml-3 text-xl font-bold text-gray-900">Digital Café</span>
      </div>
      <div
        *ngIf="isSidebarCollapsed"
        class="flex items-center justify-center w-full"
      >
        <div
          class="flex items-center justify-center h-10 w-10 bg-indigo-600 rounded-lg"
        >
          <svg
            class="w-6 h-6 text-white"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"
            />
          </svg>
        </div>
      </div>
      <button
        (click)="isSidebarCollapsed = !isSidebarCollapsed"
        class="p-2 rounded-lg hover:bg-gray-100 transition-colors"
        [class.absolute]="!isSidebarCollapsed"
        [class.right-4]="!isSidebarCollapsed"
      >
        <svg
          class="w-5 h-5 text-gray-600"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            [attr.d]="
              isSidebarCollapsed
                ? 'M13 5l7 7-7 7M5 5l7 7-7 7'
                : 'M11 19l-7-7 7-7m8 14l-7-7 7-7'
            "
          />
        </svg>
      </button>
    </div>

    <!-- Navigation Menu -->
    <nav class="flex-1 overflow-y-auto p-4">
      <div class="space-y-1">
        <p
          *ngIf="!isSidebarCollapsed"
          class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3"
        >
          Main Menu
        </p>
        <a
          *ngFor="let item of navigationItems"
          [routerLink]="item.route"
          routerLinkActive="bg-indigo-50 text-indigo-600 border-indigo-600"
          class="flex items-center px-3 py-2.5 text-sm font-medium text-gray-700 rounded-lg hover:bg-gray-50 transition-colors duration-150 border-l-4 border-transparent"
          [class.justify-center]="isSidebarCollapsed"
          [title]="isSidebarCollapsed ? item.label : ''"
        >
          <span
            [innerHTML]="getIconSVG(item.icon)"
            class="flex-shrink-0"
          ></span>
          <span *ngIf="!isSidebarCollapsed" class="ml-3">{{ item.label }}</span>
        </a>
      </div>
    </nav>

    <!-- User Profile Section -->
    <div class="border-t border-gray-200 p-4">
      <div *ngIf="!isSidebarCollapsed" class="flex items-center">
        <div class="flex-shrink-0">
          <div
            class="h-10 w-10 rounded-full bg-indigo-600 flex items-center justify-center text-white font-semibold"
          >
            {{ currentUser?.username?.charAt(0)?.toUpperCase() || "A" }}
          </div>
        </div>
        <div class="ml-3 flex-1 min-w-0">
          <p class="text-sm font-medium text-gray-900 truncate">
            {{ currentUser?.username || "Admin" }}
          </p>
          <p class="text-xs text-gray-500 truncate">
            {{ currentUser?.roles?.[0] || "ADMIN" }}
          </p>
        </div>
        <button
          (click)="logout()"
          class="p-2 rounded-lg hover:bg-gray-100 transition-colors"
          title="Logout"
        >
          <svg
            class="w-5 h-5 text-gray-600"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
            />
          </svg>
        </button>
      </div>
      <div *ngIf="isSidebarCollapsed" class="flex justify-center">
        <button
          (click)="logout()"
          class="p-2 rounded-lg hover:bg-gray-100 transition-colors"
          title="Logout"
        >
          <svg
            class="w-6 h-6 text-gray-600"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
            />
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div
    class="flex-1 flex flex-col overflow-hidden transition-all duration-300"
    [class.ml-64]="!isSidebarCollapsed"
    [class.ml-20]="isSidebarCollapsed"
  >
    <!-- Top Header Bar -->
    <header
      class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-6"
    >
      <div class="flex items-center">
        <button
          (click)="isSidebarCollapsed = !isSidebarCollapsed"
          class="lg:hidden p-2 rounded-lg hover:bg-gray-100 transition-colors mr-4"
        >
          <svg
            class="w-6 h-6 text-gray-600"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
        </button>
        <h2 class="text-lg font-semibold text-gray-900">Digital Café Admin</h2>
      </div>

      <div class="flex items-center space-x-4">
        <!-- Notifications -->
        <button
          class="relative p-2 rounded-lg hover:bg-gray-100 transition-colors"
        >
          <svg
            class="w-6 h-6 text-gray-600"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
            />
          </svg>
          <span
            class="absolute top-1 right-1 h-2 w-2 bg-red-500 rounded-full"
          ></span>
        </button>

        <!-- Settings -->
        <button class="p-2 rounded-lg hover:bg-gray-100 transition-colors">
          <svg
            class="w-6 h-6 text-gray-600"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
            />
          </svg>
        </button>

        <!-- User Profile -->
        <div class="flex items-center">
          <div
            class="h-9 w-9 rounded-full bg-indigo-600 flex items-center justify-center text-white font-semibold text-sm"
          >
            {{ currentUser?.username?.charAt(0)?.toUpperCase() || "A" }}
          </div>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 overflow-y-auto bg-gray-50">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
