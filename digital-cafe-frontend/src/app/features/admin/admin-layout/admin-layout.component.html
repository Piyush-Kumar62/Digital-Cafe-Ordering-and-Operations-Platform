<!-- Enhanced TailAdmin-style Layout -->
<div
  class="admin-shell flex h-screen overflow-hidden bg-gray-50 dark:bg-gray-900"
  [class.enhanced-modules]="!isDashboardRoute"
>
  <!-- Mobile Overlay -->
  <div
    *ngIf="!isSidebarCollapsed"
    class="fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden"
    (click)="isSidebarCollapsed = true"
  ></div>

  <!-- Sidebar -->
  <aside
    class="fixed inset-y-0 left-0 z-50 flex flex-col bg-gradient-to-b from-slate-950 via-slate-900 to-slate-800 border-r border-slate-700 transition-all duration-300 shadow-2xl"
    [class.w-64]="!isSidebarCollapsed"
    [class.w-20]="isSidebarCollapsed"
    [class.-translate-x-full]="isSidebarCollapsed"
    [class.translate-x-0]="!isSidebarCollapsed"
        [class.lg:translate-x-0]="true"
  >
    <!-- Sidebar Header with Logo -->
    <div
      class="flex items-center justify-between h-20 px-6 border-b border-gray-700"
    >
      <div *ngIf="!isSidebarCollapsed" class="flex items-center gap-3">
        <div class="relative">
          <div
            class="flex items-center justify-center h-12 w-12 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl shadow-lg"
          >
            <svg
              class="w-7 h-7 text-white"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"
              />
            </svg>
          </div>
          <div
            class="absolute -top-1 -right-1 h-3 w-3 bg-green-500 rounded-full border-2 border-gray-900"
          ></div>
        </div>
        <div>
          <h1
            (click)="goToLanding()"
            class="text-xl font-bold text-white tracking-tight cursor-pointer hover:text-indigo-400 transition"
          >
            Digital Café
          </h1>
          <p class="text-xs text-gray-400">Admin Portal</p>
        </div>
      </div>
        <div *ngIf="isSidebarCollapsed" class="flex items-center justify-center w-full">
        <div
          class="flex items-center justify-center h-12 w-12 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl"
        >
          <svg
            class="w-7 h-7 text-white"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"
            />
          </svg>
        </div>
      </div>
    </div>

    <!-- Navigation Menu -->
    <nav
      class="flex-1 overflow-y-auto px-4 py-6 scrollbar-thin scrollbar-thumb-gray-700 scrollbar-track-gray-800"
    >
      <div class="space-y-2">
        <p
          *ngIf="!isSidebarCollapsed"
          class="px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4"
        >
          Main Navigation
        </p>
        <a
          *ngFor="let item of navigationItems"
          [routerLink]="item.route"
          routerLinkActive="bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-lg"
          [routerLinkActiveOptions]="{ exact: false }"
          class="group flex items-center px-4 py-3 text-sm font-medium text-gray-300 rounded-xl hover:bg-gray-700/50 hover:text-white transition-all duration-200 relative"
          [class.justify-center]="isSidebarCollapsed"
          [title]="isSidebarCollapsed ? item.label : ''"
        >
          <span class="flex-shrink-0 transition-transform group-hover:scale-110">
            <i [class]="getIconClass(item.icon)"></i>
          </span>
          <span *ngIf="!isSidebarCollapsed" class="ml-4 transition-all">{{
            item.label
          }}</span>
          <span
            *ngIf="!isSidebarCollapsed"
            class="ml-auto opacity-0 group-hover:opacity-100 transition-opacity"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 5l7 7-7 7"
              />
            </svg>
          </span>
        </a>
      </div>
    </nav>

    <!-- Toggle Button -->
    <button
      (click)="isSidebarCollapsed = !isSidebarCollapsed"
      class="absolute right-2 top-24 bg-gradient-to-br from-sky-500 to-indigo-600 text-white p-1.5 rounded-full shadow-lg hover:shadow-xl transition-all duration-200 hover:scale-110 z-50 hidden lg:block"
    >
      <svg
        class="w-4 h-4 transition-transform"
        [class.rotate-180]="isSidebarCollapsed"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M15 19l-7-7 7-7"
        />
      </svg>
    </button>
  </aside>

  <!-- Main Content Area -->
  <div
    class="flex-1 flex min-w-0 flex-col overflow-hidden transition-all duration-300"
    [class.lg:ml-64]="!isSidebarCollapsed"
    [class.lg:ml-20]="isSidebarCollapsed"
  >
    <!-- Top Header Bar -->
    <header class="app-top-header bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-gray-200 dark:border-gray-700 h-20 flex items-center justify-between px-4 sm:px-8 shadow-sm">
      <div class="header-left flex items-center gap-4">
        <button
          (click)="isSidebarCollapsed = !isSidebarCollapsed"
          class="p-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
        >
          <svg
            class="w-6 h-6 text-gray-600 dark:text-gray-300"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
        </button>
        <div class="header-title-wrap">
          <h2 class="header-title text-xl font-bold text-gray-900 dark:text-white">
            Admin Dashboard
          </h2>
          <p class="header-subtitle text-sm text-gray-500 dark:text-gray-400">
            Manage your digital café platform
          </p>
        </div>
      </div>

      <!-- Header Actions -->
      <div class="header-actions flex items-center gap-3">
        <!-- Notifications -->
        <div #notificationContainer class="relative">
          <button
            (click)="toggleNotificationDropdown()"
            class="relative p-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
          >
            <svg
              class="w-6 h-6 text-gray-600 dark:text-gray-300"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
              />
            </svg>
            <span
              *ngIf="unreadNotifications > 0"
              class="absolute -top-1 -right-1 min-w-5 h-5 px-1 bg-red-500 text-white text-[11px] rounded-full flex items-center justify-center"
            >
              {{ unreadNotifications > 9 ? "9+" : unreadNotifications }}
            </span>
          </button>

          <div
            *ngIf="notificationDropdownOpen"
            class="notification-menu absolute right-0 top-full mt-2 w-80 max-h-96 overflow-y-auto bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow-xl z-50"
          >
            <div class="px-4 py-3 border-b border-gray-200 dark:border-gray-700">
              <p class="text-sm font-semibold text-gray-900 dark:text-white">Notifications</p>
            </div>
            <div *ngIf="notifications.length === 0" class="px-4 py-6 text-sm text-gray-500 dark:text-gray-400 text-center">
              No notifications yet
            </div>
            <div *ngFor="let item of notifications" class="px-4 py-3 border-b border-gray-100 dark:border-gray-700/60 last:border-b-0">
              <div class="mb-2 flex items-center justify-between gap-2">
                <span class="notification-severity" [ngClass]="getNotificationSeverityClass(item.severity)">
                  {{ item.severity | titlecase }}
                </span>
                <span class="text-[11px] text-gray-400 whitespace-nowrap">{{ getNotificationTime(item.timestamp) }}</span>
              </div>
              <div class="flex items-start justify-between gap-3">
                <div>
                  <p class="text-sm font-semibold text-gray-900 dark:text-white">{{ item.title }}</p>
                  <p class="text-xs text-gray-600 dark:text-gray-300 mt-1">{{ item.message }}</p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Theme Toggle -->
        <button
          (click)="toggleTheme()"
          class="p-2.5 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
          [title]="isDarkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
        >
          <svg
            *ngIf="!isDarkMode"
            class="w-6 h-6 text-gray-600 dark:text-gray-300"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
            />
          </svg>
          <svg
            *ngIf="isDarkMode"
            class="w-6 h-6 text-gray-600 dark:text-gray-300"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
            />
          </svg>
        </button>

        <!-- User Menu -->
        <div
          #profileContainer
          class="relative flex items-center pl-3 border-l border-gray-200 dark:border-gray-700"
        >
          <!-- Profile Button -->

          <button
            (click)="toggleProfileDropdown()"
            class="profile-trigger flex items-center gap-3 rounded-xl px-2 py-1 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-all duration-200"
          >
            <div class="profile-meta text-right hidden sm:block">
              <p class="text-sm font-semibold text-gray-900 dark:text-white">
                {{ getDisplayName() }}
              </p>

              <p class="text-xs text-gray-500 dark:text-gray-400">
                {{ getRoleLabel() }}
              </p>
            </div>

            <div
              class="profile-avatar h-10 w-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold shadow-md transition-all duration-300 hover:scale-105 hover:shadow-lg overflow-hidden"
            >
              <img
                *ngIf="adminProfileImage"
                [src]="adminProfileImage"
                alt="Admin Avatar"
                class="h-full w-full object-cover"
              />
              <span *ngIf="!adminProfileImage">{{ getAvatarText() }}</span>
            </div>
          </button>

          <!-- Dropdown -->

          <div
            *ngIf="profileDropdownOpen"
            class="profile-dropdown-menu absolute right-0 top-full mt-2 w-56 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow-xl overflow-hidden animate-dropdown z-50"
          >
            <!-- Profile -->

            <button
              routerLink="/admin/profile"
              (click)="profileDropdownOpen = false"
              class="flex items-center gap-3 w-full px-4 py-3 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 transition"
            >
              <span>👤</span>

              Profile
            </button>

            <button
              routerLink="/admin/settings"
              (click)="profileDropdownOpen = false"
              class="flex items-center gap-3 w-full px-4 py-3 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 transition"
            >
              <span>⚙️</span>
              Settings
            </button>

            <!-- Divider -->

            <div class="border-t border-gray-200 dark:border-gray-700"></div>

            <!-- Logout -->

            <button
              (click)="logout()"
              class="flex items-center gap-3 w-full px-4 py-3 text-red-600 hover:bg-red-50 dark:hover:bg-red-900/30 transition"
            >
              <span>🚪</span>

              Logout
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto bg-gray-50 dark:bg-gray-900">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
