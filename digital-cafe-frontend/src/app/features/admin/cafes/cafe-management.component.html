<div class="management-container">
  <div class="toolbar">
    <input
      type="text"
      [(ngModel)]="searchText"
      (input)="applyFilter()"
      placeholder="Search by cafe name, city, owner"
    />
    <span class="meta">Total: {{ filteredCafes.length }}</span>
  </div>

  <div class="card table-wrap" *ngIf="filteredCafes.length; else emptyState">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Owner</th>
          <th>Location</th>
          <th>Contact</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cafe of pagedCafes">
          <td>{{ cafe.name }}</td>
          <td>{{ cafe.ownerName || "-" }}</td>
          <td>{{ cafe.city }}, {{ cafe.state }}</td>
          <td>{{ cafe.email }}</td>
          <td>
            <span
              class="badge"
              [class.active]="cafe.isActive"
              [class.inactive]="!cafe.isActive"
            >
              {{ cafe.isActive ? "ACTIVE" : "INACTIVE" }}
            </span>
          </td>
          <td class="actions">
            <button class="btn-info" (click)="toggleStatus(cafe)">
              {{ cafe.isActive ? "Deactivate" : "Activate" }}
            </button>
            <button class="btn-danger" (click)="deleteCafe(cafe)">
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="pager">
      <div class="pager-left">
        <span class="range-text"
          >Showing {{ rangeStart }}–{{ rangeEnd }} of {{ totalElements }}</span
        >
      </div>
      <div class="pager-right">
        <button
          class="page-btn nav-btn"
          [disabled]="pageIndex === 0"
          (click)="goToPage(pageIndex - 1)"
        >
          ← Prev</button>
        <button
          class="page-btn"
          *ngFor="let p of allPages"
          [class.active]="p === pageIndex"
          (click)="goToPage(p)"
        >
          {{ p + 1 }}
        </button>
        <button
          class="page-btn nav-btn"
          [disabled]="pageIndex >= totalPages - 1"
          (click)="goToPage(pageIndex + 1)"
        >
          Next →</button>
      </div>
    </div>
  </div>

  <ng-template #emptyState>
    <div class="card empty">No cafes found.</div>
  </ng-template>
</div>
