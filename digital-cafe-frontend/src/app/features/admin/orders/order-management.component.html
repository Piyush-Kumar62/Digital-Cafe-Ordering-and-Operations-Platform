<div class="management-container">
  <div class="toolbar">
    <select [(ngModel)]="selectedCafeId" (change)="pageIndex = 0; loadOrders()">
      <option [ngValue]="null">Select cafe</option>
      <option *ngFor="let cafe of cafes" [ngValue]="cafe.id">
        {{ cafe.name }}
      </option>
    </select>
    <span class="meta">Auto refresh: {{ refreshSeconds }}s</span>
  </div>

  <div class="card table-wrap" *ngIf="orders.length; else emptyState">
    <table>
      <thead>
        <tr>
          <th>Order</th>
          <th>Customer</th>
          <th>Total</th>
          <th>Status</th>
          <th>Placed</th>
          <th>Update</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let order of orders">
          <td>{{ order.orderNumber }}</td>
          <td>{{ order.customerName || "-" }}</td>
          <td>{{ order.totalAmount }}</td>
          <td>{{ order.status }}</td>
          <td>{{ getPlacedAt(order) }}</td>
          <td class="actions">
            <select [(ngModel)]="statusMap[order.id]">
              <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
            </select>
            <button class="btn-info" (click)="updateStatus(order)">Save</button>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="pager">
      <div class="pager-left">
        <span class="range-text"
          >Showing {{ rangeStart }}–{{ rangeEnd }} of {{ totalElements }}</span
        >
      </div>
      <div class="pager-right">
        <button
          class="page-btn nav-btn"
          [disabled]="pageIndex === 0"
          (click)="goToPage(pageIndex - 1)"
        >
          ← Prev</button>
        <button
          class="page-btn"
          *ngFor="let p of allPages"
          [class.active]="p === pageIndex"
          (click)="goToPage(p)"
        >
          {{ p + 1 }}
        </button>
        <button
          class="page-btn nav-btn"
          [disabled]="pageIndex >= totalPages - 1"
          (click)="goToPage(pageIndex + 1)"
        >
          Next →</button>
      </div>
    </div>
  </div>

  <ng-template #emptyState>
    <div class="card empty">No orders found for selected cafe.</div>
  </ng-template>
</div>
