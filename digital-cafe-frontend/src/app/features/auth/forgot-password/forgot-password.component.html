<app-navbar></app-navbar>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="auth-title">Forgot Password</h1>
      <p class="auth-subtitle">Enter your email to receive a reset link.</p>
    </div>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="auth-form" *ngIf="!sent">
      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="form-input"
          [class.error]="f['email'].invalid && f['email'].touched"
          placeholder="example@gmail.com"
        />
        <div class="error-message" *ngIf="f['email'].invalid && f['email'].touched">
          <span *ngIf="f['email'].errors?.['required']">Email is required</span>
          <span *ngIf="f['email'].errors?.['email']">Please enter a valid email address</span>
        </div>
      </div>

      <button class="btn-submit" type="submit" [disabled]="loading">
        <span *ngIf="!loading">Send Reset Link</span>
        <span *ngIf="loading" class="loading-spinner"></span>
      </button>
    </form>

    <div class="success-state" *ngIf="sent">
      <p>We sent a password reset link to your email.</p>
      <p>Please check your inbox and follow the instructions.</p>
    </div>

    <div class="auth-footer">
      <p><a routerLink="/auth/login" class="auth-link">Back to Login</a></p>
    </div>
  </div>
</div>
