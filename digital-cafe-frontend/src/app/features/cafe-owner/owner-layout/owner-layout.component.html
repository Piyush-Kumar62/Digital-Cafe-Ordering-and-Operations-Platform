<div class="owner-shell">
  <!-- Mobile overlay -->
  <div
    *ngIf="!isSidebarCollapsed"
    class="mobile-overlay"
    (click)="isSidebarCollapsed = true"
  ></div>

  <!-- Sidebar -->
  <aside class="sidebar" [class.collapsed]="isSidebarCollapsed">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-icon">
          <!-- Coffee cup icon -->
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M17 8h1a4 4 0 0 1 0 8h-1" />
            <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z" />
            <line x1="6" y1="2" x2="6" y2="4" />
            <line x1="10" y1="2" x2="10" y2="4" />
            <line x1="14" y1="2" x2="14" y2="4" />
          </svg>
        </div>
        <span *ngIf="!isSidebarCollapsed" class="brand-text">Digital Café</span>
      </div>
      <button
        class="collapse-toggle"
        (click)="toggleSidebar()"
        title="Toggle menu"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
        >
          <path
            [attr.d]="isSidebarCollapsed ? 'M9 18l6-6-6-6' : 'M15 18l-6-6 6-6'"
          />
        </svg>
      </button>
    </div>

    <div class="back-home" (click)="goHome()">
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M19 12H5M12 5l-7 7 7 7" />
      </svg>
      <span *ngIf="!isSidebarCollapsed">Back to Home</span>
    </div>

    <!-- Multi-café switcher (only visible when owner has >1 café) -->
    <div
      class="cafe-switcher"
      *ngIf="allCafes.length > 1"
      [class.collapsed]="isSidebarCollapsed"
    >
      <button
        class="cafe-switcher-btn"
        (click)="toggleCafePicker()"
        [title]="activeCafe?.name || 'Select Café'"
      >
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="cafe-switcher-icon"
        >
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        <span *ngIf="!isSidebarCollapsed" class="cafe-switcher-name">
          {{ activeCafe?.name || "Select Café" }}
        </span>
        <svg
          *ngIf="!isSidebarCollapsed"
          width="12"
          height="12"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          class="cafe-switcher-chevron"
          [style.transform]="cafePickerOpen ? 'rotate(180deg)' : 'rotate(0deg)'"
        >
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </button>

      <!-- Café dropdown list -->
      <div *ngIf="cafePickerOpen && !isSidebarCollapsed" class="cafe-picker-list">
        <button
          *ngFor="let cafe of allCafes"
          class="cafe-picker-item"
          [class.active]="cafe.id === activeCafe?.id"
          (click)="selectCafe(cafe)"
        >
          <svg
            *ngIf="cafe.id === activeCafe?.id"
            width="12"
            height="12"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            class="cafe-picker-check"
          >
            <polyline points="20 6 9 17 4 12" />
          </svg>
          <span>{{ cafe.name }}</span>
        </button>
      </div>
    </div>

    <nav>
      <a
        *ngFor="let item of navigationItems"
        [routerLink]="item.route"
        routerLinkActive="active"
        [title]="item.label"
      >
        <span class="nav-icon">
          <i class="bi bi-{{ item.icon }}"></i>
        </span>
        <span *ngIf="!isSidebarCollapsed" class="nav-label">{{
          item.label
        }}</span>
      </a>
    </nav>

    <div class="sidebar-footer" *ngIf="!isSidebarCollapsed">
      <p class="owner-portal-label">Café Owner Portal</p>
    </div>
  </aside>

  <!-- Right side -->
  <div class="main-area" [class.sidebar-open]="!isSidebarCollapsed">
    <!-- Top Header -->
    <header class="top-header">
      <div class="header-left">
        <button class="menu-toggle" (click)="toggleSidebar()">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
          >
            <path d="M3 6h18M3 12h18M3 18h18" />
          </svg>
        </button>
        <div class="header-title-wrap">
          <h2 class="header-title">{{ getPageTitle() }}</h2>
          <p class="header-subtitle">{{ getPageSubtitle() }}</p>
        </div>
      </div>

      <div class="header-actions">
        <!-- Theme toggle -->
        <button
          class="icon-btn theme-btn"
          (click)="toggleTheme()"
          [title]="isDarkMode ? 'Switch to Light mode' : 'Switch to Dark mode'"
        >
          <!-- Moon icon (light mode → switch to dark) -->
          <svg
            *ngIf="!isDarkMode"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          <!-- Sun icon (dark mode → switch to light) -->
          <svg
            *ngIf="isDarkMode"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
        </button>

        <!-- Profile -->
        <div class="profile-wrap" #profileContainer>
          <button class="profile-btn" (click)="toggleProfileDropdown()">
            <div class="profile-meta">
              <p class="profile-name">{{ getDisplayName() }}</p>
              <p class="profile-role">Café Owner</p>
            </div>
            <div class="avatar">
              <img
                *ngIf="profileImage"
                [src]="profileImage"
                alt="Profile"
                class="avatar-img"
              />
              <span *ngIf="!profileImage" class="avatar-initials">{{
                getAvatarText()
              }}</span>
            </div>
          </button>

          <!-- Dropdown -->
          <div *ngIf="profileDropdownOpen" class="profile-dropdown">
            <div class="dropdown-user">
              <div class="dropdown-avatar">
                <img *ngIf="profileImage" [src]="profileImage" alt="Profile" />
                <span *ngIf="!profileImage">{{ getAvatarText() }}</span>
              </div>
              <div>
                <p class="dropdown-name">{{ getDisplayName() }}</p>
                <p class="dropdown-email">{{ getUserEmail() }}</p>
              </div>
            </div>
            <div class="dropdown-divider"></div>
            <button
              routerLink="/owner/cafes"
              (click)="profileDropdownOpen = false"
              class="dropdown-item"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
              </svg>
              My Café
            </button>
            <button
              routerLink="/owner/settings"
              (click)="profileDropdownOpen = false"
              class="dropdown-item"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="3" />
                <path
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
                />
              </svg>
              Settings
            </button>
            <div class="dropdown-divider"></div>
            <button (click)="logout()" class="dropdown-item danger">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
              Logout
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Page content -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
