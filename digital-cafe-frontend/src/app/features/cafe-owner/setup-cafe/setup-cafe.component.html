<div *ngIf="successMessage" class="success-banner">
  {{ successMessage }}
</div>
<div class="setup-bg">
  <div class="overlay"></div>

  <div class="setup-wrapper">
    <div class="setup-card">
      <div class="header">
        <h2 class="page-title">
          {{ isEditMode ? "Edit Cafe Details" : "Setup Your Cafe" }}
        </h2>
        <p>Provide details to launch your café dashboard</p>
      </div>

      <form [formGroup]="cafeForm" (ngSubmit)="submit()" class="setup-form">
        <!-- Cafe Name -->
        <div class="form-group">
          <label>Café Name</label>
          <input
            type="text"
            formControlName="name"
            placeholder="e.g. Brew Haven"
          />
        </div>

        <!-- Description -->
        <div class="form-group">
          <label>Description <span class="optional">(optional)</span></label>
          <textarea
            formControlName="description"
            placeholder="Tell customers what makes your café special…"
            rows="3"
          ></textarea>
        </div>

        <app-address-form
          [form]="cafeForm"
          variant="cafe"
          [showPlotNumber]="false"
          streetLabel="Address"
          [controlMap]="{ street: 'address', city: 'city', state: 'state', pincode: 'pincode' }"
          [formSubmitted]="addressFormSubmitted"
        ></app-address-form>

        <!-- Landmark -->
        <div class="form-group">
          <label>Landmark <span class="optional">(optional)</span></label>
          <input
            type="text"
            formControlName="landmark"
            placeholder="Nearby landmark"
          />
        </div>

        <!-- Phone -->
        <div class="form-row">
          <div class="form-group">
            <label>Phone Number</label>
            <div class="phone-input">
              <span class="phone-prefix">+91</span>
              <input
                type="text"
                formControlName="phoneNumber"
                placeholder="10 digit number"
                maxlength="10"
                inputmode="numeric"
              />
            </div>
          </div>
        </div>

        <!-- Opening + Closing -->
        <div class="form-row">
          <div class="form-group">
            <label>Opening Time</label>
            <input type="time" formControlName="openingTime" />
          </div>

          <div class="form-group">
            <label>Closing Time</label>
            <input type="time" formControlName="closingTime" />
          </div>
        </div>

        <!-- ================= LEGAL DETAILS ================= -->
        <div class="legal-section">
          <h3>Legal Details</h3>

          <div class="form-row">
            <div class="form-group">
              <label>FSSAI License Number</label>
              <input
                type="text"
                formControlName="fssaiNumber"
                placeholder="14 digit FSSAI number"
              />
            </div>

            <div class="form-group">
              <label>GST Number</label>
              <input
                type="text"
                formControlName="gstNumber"
                placeholder="GSTIN (e.g. 27ABCDE1234F1Z5)"
              />
            </div>
          </div>

          <div class="form-group">
            <label>MSME Registration</label>
            <input
              type="text"
              formControlName="msmeNumber"
              placeholder="UDYAM Registration Number"
            />
          </div>
        </div>

        <!-- Logo Upload -->
        <div class="form-group">
          <label>Café Logo</label>

          <div class="file-upload">
            <input type="file" (change)="onFileChange($event)" />

            <div class="upload-ui">
              <span class="icon">📁</span>
              <span>
                {{ selectedFile?.name || "Choose logo file..." }}
              </span>
            </div>
          </div>

          <!-- Preview -->
          <div class="preview" *ngIf="previewUrl">
            <img [src]="previewUrl" />
          </div>
        </div>

        <button type="submit" class="primary-btn" [disabled]="loading">
          {{ isEditMode ? "Update Cafe" : "Create Cafe" }}
        </button>
      </form>
    </div>
  </div>
</div>
