<div class="container mx-auto px-4 py-8 max-w-2xl">
  <h1 class="text-4xl font-extrabold text-gray-800 mb-8 text-center">Book a Table</h1>

  <form [formGroup]="bookingForm" (ngSubmit)="onSubmit()" class="bg-white rounded-lg shadow-lg p-8 space-y-6">

    <div *ngIf="bookingSuccess" class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4" role="alert">
      <p class="font-bold">Success!</p>
      <p>Your booking has been made successfully. You will be redirected shortly.</p>
    </div>

    <div *ngIf="bookingError" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4" role="alert">
      <p class="font-bold">Error</p>
      <p>There was a problem with your booking. Please try again.</p>
    </div>

    <div>
      <label for="tableId" class="block text-sm font-medium text-gray-700">Select a Table</label>
      <select formControlName="tableId" id="tableId" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md">
        <option value="" disabled>Choose a table</option>
        <option *ngFor="let table of availableTables$ | async" [value]="table.id">
          {{ table.tableNumber }} (Capacity: {{ table.capacity }})
        </option>
      </select>
      <div *ngIf="bookingForm.get('tableId')?.touched && bookingForm.get('tableId')?.errors?.['required']" class="text-red-500 text-xs mt-1">
        Table selection is required.
      </div>
    </div>

    <div>
      <label for="bookingDate" class="block text-sm font-medium text-gray-700">Date</label>
      <input type="date" formControlName="bookingDate" id="bookingDate" class="mt-1 focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md">
      <div *ngIf="bookingForm.get('bookingDate')?.touched && bookingForm.get('bookingDate')?.errors?.['required']" class="text-red-500 text-xs mt-1">
        Date is required.
      </div>
    </div>

    <div>
      <label for="bookingTime" class="block text-sm font-medium text-gray-700">Time</label>
      <input type="time" formControlName="bookingTime" id="bookingTime" class="mt-1 focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md">
      <div *ngIf="bookingForm.get('bookingTime')?.touched && bookingForm.get('bookingTime')?.errors?.['required']" class="text-red-500 text-xs mt-1">
        Time is required.
      </div>
    </div>

    <div>
      <label for="numberOfGuests" class="block text-sm font-medium text-gray-700">Number of Guests</label>
      <input type="number" formControlName="numberOfGuests" id="numberOfGuests" placeholder="e.g., 4" class="mt-1 focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md">
      <div *ngIf="bookingForm.get('numberOfGuests')?.touched && bookingForm.get('numberOfGuests')?.errors?.['required']" class="text-red-500 text-xs mt-1">
        Number of guests is required.
      </div>
       <div *ngIf="bookingForm.get('numberOfGuests')?.errors?.['min']" class="text-red-500 text-xs mt-1">
        Must be at least 1 guest.
      </div>
    </div>

    <div>
      <label for="specialRequests" class="block text-sm font-medium text-gray-700">Special Requests (Optional)</label>
      <textarea formControlName="specialRequests" id="specialRequests" rows="3" placeholder="Any special requirements?" class="mt-1 focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md"></textarea>
    </div>

    <div class="pt-4">
      <button type="submit" [disabled]="bookingForm.invalid || isSubmitting" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:bg-indigo-400 disabled:cursor-not-allowed">
        <span *ngIf="!isSubmitting">Book Now</span>
        <span *ngIf="isSubmitting">Submitting...</span>
      </button>
    </div>
  </form>
</div>
