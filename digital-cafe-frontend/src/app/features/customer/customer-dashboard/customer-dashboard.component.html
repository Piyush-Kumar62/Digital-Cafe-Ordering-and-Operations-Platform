<div class="flex h-screen bg-gray-100 font-sans">
  <!-- Sidebar -->
  <aside class="w-64 bg-gray-800 text-white flex-shrink-0">
    <div class="p-6 text-2xl font-extrabold border-b border-gray-700">
      <a routerLink="/customer">Customer Area</a>
    </div>
    <nav class="mt-6">
      <ul>
        <li *ngFor="let link of navLinks" class="px-6 py-2">
          <a [routerLink]="link.path" routerLinkActive="bg-gray-700 text-white"
             class="flex items-center p-3 rounded-lg hover:bg-gray-700 transition-colors duration-200">
            <i class="material-icons mr-4">{{ link.icon }}</i>
            <span class="flex-1">{{ link.label }}</span>
            <span *ngIf="link.path === 'cart' && (cartItemCount$ | async) as count"
                  class="bg-indigo-500 text-xs font-bold rounded-full h-6 w-6 flex items-center justify-center">
              {{ count }}
            </span>
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col overflow-hidden">
    <!-- Topbar (optional) -->
    <header class="bg-white shadow-md p-4">
        <h1 class="text-xl font-semibold text-gray-700">Digital Café</h1>
    </header>

    <!-- Content Area -->
    <div class="flex-1 p-6 md:p-8 overflow-y-auto">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
