<div class="container mx-auto px-4 py-8 max-w-3xl">
  <h1 class="text-3xl font-extrabold text-gray-800 mb-6 text-center">Order Payment</h1>

  <div *ngIf="loading" class="bg-white rounded-lg shadow p-8 text-center text-gray-600">
    Loading payment details...
  </div>

  <div *ngIf="!loading && order" class="bg-white rounded-lg shadow p-6">
    <div class="mb-6">
      <p class="text-sm text-gray-500">Order</p>
      <p class="text-xl font-bold text-gray-900">#{{ order.orderNumber || order.id }}</p>
    </div>

    <div class="mb-6 border rounded-lg p-4 bg-gray-50">
      <div class="flex justify-between text-sm mb-2">
        <span class="text-gray-600">Subtotal</span>
        <span>${{ order.subtotal || 0 | number:'1.2-2' }}</span>
      </div>
      <div class="flex justify-between text-sm mb-2">
        <span class="text-gray-600">Tax</span>
        <span>${{ order.tax || 0 | number:'1.2-2' }}</span>
      </div>
      <div class="flex justify-between text-lg font-bold">
        <span>Total</span>
        <span>${{ order.totalAmount | number:'1.2-2' }}</span>
      </div>
    </div>

    <div *ngIf="payment?.status === PaymentStatus.COMPLETED" class="mb-6 p-4 rounded bg-green-50 border border-green-200 text-green-700">
      Payment already completed for this order.
    </div>

    <div *ngIf="payment?.status !== PaymentStatus.COMPLETED" class="mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-2">Payment Method</label>
      <select [(ngModel)]="selectedMethod" class="w-full border rounded-md px-3 py-2">
        <option *ngFor="let method of methods" [value]="method">{{ method }}</option>
      </select>
    </div>

    <div class="flex justify-between items-center">
      <a routerLink="/customer/cart" class="text-gray-600 hover:text-gray-900 font-medium">Back to Cart</a>
      <button
        (click)="payNow()"
        [disabled]="processing"
        class="bg-indigo-600 text-white font-semibold py-2 px-5 rounded-md hover:bg-indigo-700 disabled:opacity-60"
      >
        {{ payment?.status === PaymentStatus.COMPLETED ? 'Go To Tracking' : (processing ? 'Processing...' : 'Pay Now') }}
      </button>
    </div>
  </div>
</div>
