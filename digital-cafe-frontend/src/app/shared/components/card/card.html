<div class="card" [ngClass]="'variant-' + variant">
  <div class="card-header">
    <h3 class="card-title">{{ title }}</h3>
    <span class="material-icons card-icon">{{ icon }}</span>
  </div>
  <div class="card-body">
    <p class="card-value">{{ value }}</p>
    <p class="card-description">{{ description }}</p>
  </div>
</div>
