<nav class="navbar" [class.landing-navbar]="isLandingPage">
  <div class="navbar-container">
    <div class="navbar-brand">
      <a routerLink="/" class="brand-link">
        <span class="brand-logo">
          <img
            src="assets/branding/brand-logo.png"
            alt="Digital Café Logo"
            class="logo-img"
          />
        </span>
        <span class="brand-name">Digital Café</span>
      </a>
    </div>

    <div class="navbar-right">
      <div class="navbar-menu" [class.active]="menuOpen">
        <!-- Public Navigation Links -->
        <a
          routerLink="/"
          class="nav-link"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMenu(); scrollToTop()"
          >Home</a
        >
        <a
          routerLink="/"
          fragment="features"
          class="nav-link"
          (click)="closeMenu(); scrollToFragment('features')"
          >Features</a
        >
        <a
          routerLink="/"
          fragment="how-it-works"
          class="nav-link"
          (click)="closeMenu(); scrollToFragment('how-it-works')"
          >How It Works</a
        >
        <a
          routerLink="/cafes"
          class="nav-link"
          routerLinkActive="active"
          (click)="closeMenu(); scrollToTop()"
          >Cafés</a
        >
        <a
          routerLink="/about"
          class="nav-link"
          routerLinkActive="active"
          (click)="closeMenu(); scrollToTop()"
          >About</a
        >
        <a
          routerLink="/contact"
          class="nav-link"
          routerLinkActive="active"
          (click)="closeMenu(); scrollToTop()"
          >Contact</a
        >

        <ng-container *ngIf="!isAuthenticated">
          <a routerLink="/auth/login" class="nav-link" (click)="closeMenu()"
            >Login</a
          >
          <a routerLink="/auth/register" class="nav-link" (click)="closeMenu()"
            >Register</a
          >
        </ng-container>

        <ng-container *ngIf="isAuthenticated && user">
          <a
            [routerLink]="dashboardRoute"
            class="nav-link"
            (click)="closeMenu()"
            >Dashboard</a
          >
          <div class="user-menu" #userMenuRef [class.open]="userMenuOpen">
            <button
              class="user-trigger"
              type="button"
              aria-haspopup="true"
              [attr.aria-expanded]="userMenuOpen"
              (click)="toggleUserMenu($event)"
            >
              <span class="user-avatar">
                <img
                  *ngIf="hasAvatar; else avatarFallback"
                  [src]="avatarUrl"
                  alt="Profile"
                  (error)="onAvatarError()"
                />
                <ng-template #avatarFallback>
                  {{ getDisplayName().charAt(0) }}
                </ng-template>
                <span class="online-dot" aria-hidden="true"></span>
              </span>
              <span class="user-meta">
                <span class="user-name">{{ getDisplayName() }}</span>
                <span class="user-role">{{ roleLabel }}</span>
              </span>
              <span class="user-caret">▾</span>
            </button>
            <div class="user-dropdown" (click)="$event.stopPropagation()">
              <div class="dropdown-card">
                <div class="dropdown-header">
                  <div class="dropdown-avatar">
                    <img
                      *ngIf="hasAvatar; else dropdownFallback"
                      [src]="avatarUrl"
                      alt="Profile"
                      (error)="onAvatarError()"
                    />
                    <ng-template #dropdownFallback>
                      {{ getDisplayName().charAt(0) }}
                    </ng-template>
                    <span class="online-dot" aria-hidden="true"></span>
                  </div>
                  <div class="dropdown-meta">
                    <span class="dropdown-name">{{ getDisplayName() }}</span>
                    <span class="dropdown-email">{{ user.email }}</span>
                    <span class="dropdown-role">{{ roleLabel }}</span>
                  </div>
                </div>
                <div class="dropdown-actions">
                  <a
                    class="dropdown-link"
                    [routerLink]="dashboardRoute"
                    (click)="closeUserMenu()"
                  >
                    <span class="link-icon link-icon--dashboard">
                      <span class="icon-bars"></span>
                    </span>
                    <span class="link-text">
                      <span class="link-title">Dashboard</span>
                      <span class="link-subtitle">View activity</span>
                    </span>
                  </a>
                  <a
                    class="dropdown-link"
                    [routerLink]="profileRoute"
                    (click)="closeUserMenu()"
                  >
                    <span class="link-icon link-icon--profile">
                      <span class="icon-user"></span>
                    </span>
                    <span class="link-text">
                      <span class="link-title">My Profile</span>
                      <span class="link-subtitle">Edit account</span>
                    </span>
                  </a>
                </div>
                <div class="dropdown-divider"></div>
                <button class="dropdown-item logout-item" (click)="logout()">
                  <span class="logout-icon">⏻</span>
                  <span class="logout-text">
                    <span class="logout-title">Sign Out</span>
                  </span>
                </button>
              </div>
            </div>
          </div>
        </ng-container>
      </div>

      <button
        class="theme-toggle"
        [class.dark]="isDarkMode"
        (click)="toggleTheme()"
        [attr.aria-label]="
          isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'
        "
      >
        <span class="toggle-track">
          <span class="toggle-icon sun" aria-hidden="true">☀</span>
          <span class="toggle-icon moon" aria-hidden="true">
            <span class="moon-crescent"></span>
            <span class="moon-sparkle sparkle-1">✦</span>
            <span class="moon-sparkle sparkle-2">✦</span>
          </span>
          <span class="toggle-thumb" aria-hidden="true"></span>
        </span>
      </button>

      <button class="menu-toggle" (click)="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</nav>
<div
  class="navbar-spacer"
  [class.landing-spacer]="isLandingPage || isLegalPage"
  [class.legal-spacer]="isLegalPage"
  aria-hidden="true"
></div>
