services:
  nginx:
    image: nginx:1.27-alpine
    container_name: digital-cafe-edge
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/cafehub.tech.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    networks:
      - digital-cafe-net

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/your-org/digital-cafe-backend:latest}
    container_name: digital-cafe-backend
    restart: unless-stopped
    env_file:
      - ./digital-cafe-backend/.env
    environment:
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-TEST}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
    expose:
      - "8080"
    networks:
      - digital-cafe-net

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/your-org/digital-cafe-frontend:latest}
    container_name: digital-cafe-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - digital-cafe-net

networks:
  digital-cafe-net:
    driver: bridge
