services:
  mysql:
    image: mysql:8.0.39
    container_name: digital-cafe-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: digital_cafe_db
      MYSQL_ROOT_PASSWORD: digitalcafe
    volumes:
      - mysql80-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-pdigitalcafe",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - digital-cafe-net

  backend:
    build:
      context: ./digital-cafe-backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-digital-cafe-backend:local}
    container_name: digital-cafe-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ./digital-cafe-backend/.env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: digital_cafe_db
      DB_USERNAME: root
      DB_PASSWORD: digitalcafe
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/digital_cafe_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: digitalcafe
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      JWT_SECRET: 0123456789abcdef0123456789abcdef
      PAYMENT_GATEWAY: TEST
      FRONTEND_URL: http://localhost
      APP_DATA_INIT_ENABLED: "true"
      APP_DEV_SEED_ENABLED: "true"
      APP_STORAGE_PROVIDER: local
      APP_UPLOAD_DIR: uploads
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/public/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - digital-cafe-net

  frontend:
    build:
      context: ./digital-cafe-frontend
      dockerfile: Dockerfile
    image: ${FRONTEND_IMAGE:-digital-cafe-frontend:local}
    container_name: digital-cafe-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - digital-cafe-net

networks:
  digital-cafe-net:
    driver: bridge

volumes:
  mysql80-data:
