services:
  nginx:
    image: nginx:1.27-alpine
    container_name: digital-cafe-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/cafehub.tech.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - digital-cafe-net

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/your-org/digital-cafe-backend:latest}
    container_name: digital-cafe-backend
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: true
      - path: ./digital-cafe-backend/.env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-deploy}
      FRONTEND_URL: ${FRONTEND_URL:-https://cafehub.tech}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://cafehub.tech,https://www.cafehub.tech}
      APP_STORAGE_PROVIDER: ${APP_STORAGE_PROVIDER:-s3}
      APP_UPLOAD_DIR: ${APP_UPLOAD_DIR:-/var/app/uploads}
      APP_DEV_SEED_ENABLED: "false"
      APP_DATA_INIT_ENABLED: "false"
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-TEST}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
    volumes:
      - ./uploads:/var/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - digital-cafe-net

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/your-org/digital-cafe-frontend:latest}
    container_name: digital-cafe-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - digital-cafe-net

networks:
  digital-cafe-net:
    driver: bridge
